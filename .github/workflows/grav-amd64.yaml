name: Grav amd64 build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./grav
          file: ./grav/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/clubcedille/grav:latest
            ghcr.io/clubcedille/grav:1.7.53.5
            ghcr.io/clubcedille/grav:amd64-1.7.53.5
